name: Publish RoboDojo playback files
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'qwenoft-robodojo-100k-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify and publish the playback files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release download qwenoft-robodojo-100k-v1 --pattern 'qwenoft-robodojo-*.zip' --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          echo 'da2e1bd235b64267aef657adf83c62ab8eba78a6887d06f11d2bd32a6869564e  qwenoft-robodojo-videos.zip' | sha256sum -c
          echo '885a607dc0df944dbd2f5ec95d966c87a32263eba9ba1bfff8558b062f3df180  qwenoft-robodojo-keyframes.zip' | sha256sum -c
          cd "$GITHUB_WORKSPACE"
          git switch --orphan robodojo-media-v1
          unzip -q "$RUNNER_TEMP/qwenoft-robodojo-videos.zip"
          unzip -q "$RUNNER_TEMP/qwenoft-robodojo-keyframes.zip"
          test "$(find videos -name '*.mp4' | wc -l)" -eq 5127
          test "$(find frames/timeline -name '*.jpg' | wc -l)" -eq 1709
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add videos frames
          git commit -qm 'Publish three synchronized views for each RoboDojo failure'
          git push origin HEAD:refs/heads/robodojo-media-v1
