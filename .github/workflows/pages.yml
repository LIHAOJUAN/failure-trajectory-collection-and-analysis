name: Publish experiment pages
on:
  push:
    branches: [main]
    paths: ["index.html", "experiments/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: experiment-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          set -eu
          mkdir site
          cp index.html site/
          cp -R experiments site/
          curl -fL --retry 3 -o "$RUNNER_TEMP/atlas.zip" "https://github.com/LIHAOJUAN/failure-trajectory-collection-and-analysis/releases/download/qwenoft-robotwin-140k-v1/qwenoft-robotwin-140k.zip"
          echo "69e8d64fb882135b8031a6169c3a69f75cf9e4936f9048ae4d25a83a0467ad97  $RUNNER_TEMP/atlas.zip" | sha256sum -c -
          unzip -oq "$RUNNER_TEMP/atlas.zip" -d site/experiments/qwenoft-robotwin-140k
      - name: Publish RoboDojo representative replays from Releases
        run: |
          set -eu
          export DOJO_ARCHIVE="$RUNNER_TEMP/dojo.zip"
          curl -fL --retry 3 -o "$DOJO_ARCHIVE" "https://github.com/LIHAOJUAN/failure-trajectory-collection-and-analysis/releases/download/qwenoft-robodojo-100k-v1/qwenoft-robodojo-videos.zip"
          echo "da2e1bd235b64267aef657adf83c62ab8eba78a6887d06f11d2bd32a6869564e  $DOJO_ARCHIVE" | sha256sum -c -
          python3 - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          site = Path('site/experiments/qwenoft-robodojo-100k')
          index = site / 'failures.json'
          data = json.loads(index.read_text())
          examples = {key for ids in data['representatives'].values() for key in ids}
          with zipfile.ZipFile(os.environ['DOJO_ARCHIVE']) as archive:
              names = set(archive.namelist())
              for case in data['cases']:
                  for camera, url in case['videos'].items():
                      path = f"videos/{case['id']}-{camera}.mp4"
                      assert path in names, path
                      if case['id'] in examples:
                          archive.extract(path, site)
                          case['videos'][camera] = path
          index.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')))
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
